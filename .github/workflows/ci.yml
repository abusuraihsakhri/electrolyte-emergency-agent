name: Test and deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,test]"
          python -m pip check
      - name: Check Python compilation
        run: python -m compileall -q agents electrolyte_emergency_agent electrolyte_guard.py enrichment.py tests test_electrolyte_guard.py
      - name: Validate browser JavaScript and deployment contracts
        run: |
          python - <<'PY'
          import pathlib, re, subprocess, tempfile
          page = pathlib.Path("web/index.html").read_text(encoding="utf-8")
          assert 'fetch("./electrolyte_guard.py")' in page
          assert 'cdn.jsdelivr.net/pyodide/' in page
          assert "HMAC_SHA256_e83f" not in page
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", page, flags=re.S)
          assert scripts and any(script.strip() for script in scripts)
          with tempfile.TemporaryDirectory() as folder:
              for i, script in enumerate(scripts):
                  if script.strip():
                      file = pathlib.Path(folder, f"inline-{i}.js")
                      file.write_text(script, encoding="utf-8")
                      subprocess.run(["node", "--check", str(file)], check=True)
          PY
      - name: Run test suite
        run: python -m pytest -q
      - name: Check signed audit integrity
        run: |
          python - <<'PY'
          from agents.base import AuditTrail
          trail = AuditTrail(secret_key="ephemeral-ci-only")
          trail.log("ci", "test", "check", {"passed": True})
          assert trail.verify_integrity()
          trail.logs[0]["event_type"] = "tampered"
          assert not trail.verify_integrity()
          PY

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp web/index.html _site/index.html
          cp electrolyte_guard.py _site/electrolyte_guard.py
          test -s _site/index.html
          test -s _site/electrolyte_guard.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
